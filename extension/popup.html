<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>VCU · 网页</title>
  <style>
    :root { color-scheme: light dark; --surface: light-dark(#fff,#202124); --ink: light-dark(#202124,#eee); --muted: light-dark(#666,#b2b2b6); --line: light-dark(#e5e5e9,#414147); --accent: #b243bd; }
    * { box-sizing: border-box; }
    body { margin:0; width:370px; background:var(--surface); color:var(--ink); font:13px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 16px 10px; }
    h1 { font-size:16px; margin:0; letter-spacing:-.2px; }
    p { margin:0; }
    button,input { font:inherit; color:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:6px 10px; }
    button:hover { background:light-dark(#f5f1f8,#343038); }
    button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button:disabled { opacity:.45; cursor:default; }
    #notice { padding:0 16px 10px; color:var(--muted); min-height:28px; }
    #notice.error { color:light-dark(#b32222,#ff9898); }
    main { max-height:350px; overflow-y:auto; padding:0 10px 8px; }
    .window-heading { margin:12px 6px 6px; font-size:12px; font-weight:600; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .group { border-top:3px solid var(--group-color); padding-top:5px; margin:8px 0; }
    .group-head { display:flex; align-items:center; gap:6px; margin:0 6px 4px; }
    .group-name { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .group-head button { padding:3px 8px; font-size:12px; }
    .row { display:flex; align-items:center; gap:8px; border-radius:8px; padding:5px 6px; }
    .row.active { background:light-dark(#f4eef8,#37303d); }
    .row input { accent-color:var(--accent); flex:none; }
    .tab { min-width:0; flex:1; border:0; text-align:left; padding:3px 5px; background:transparent; }
    .title,.host { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .host { color:var(--muted); font-size:11px; }
    form { border-top:1px solid var(--line); padding:12px 16px; }
    label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; }
    .fields { display:flex; gap:6px; }
    #group-title { min-width:0; flex:1; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--surface); }
    #create-group { background:var(--accent); border-color:var(--accent); color:#fff; }
    #ungroup { margin-top:8px; font-size:12px; }
    footer { padding:0 16px 12px; color:var(--muted); font-size:11px; }
    details { border-top:1px solid var(--line); padding-top:9px; }
    #status { white-space:pre-wrap; margin:6px 0; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header><h1>VCU · 网页</h1><button id="refresh" aria-label="刷新网页列表">刷新</button></header>
  <p id="notice" role="status" aria-live="polite">正在读取网页…</p>
  <main id="tabs" aria-label="浏览器网页"></main>
  <form id="group-form">
    <label id="selection-label" for="group-title">将勾选的网页整理为任务标签组</label>
    <div class="fields"><input id="group-title" aria-label="标签组名称" aria-describedby="selection-label" maxlength="80" placeholder="例如：🎨 分享设计" required><button id="create-group" type="submit" disabled>分组</button></div>
    <button id="ungroup" type="button" disabled>移出标签组</button>
  </form>
  <footer><details><summary>连接状态</summary><p id="status"></p><button id="boot">重新连接</button> <button id="reloadsw">重载扩展</button></details></footer>
  <script src="popup.js"></script>
</body>
</html>
