<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VCU virtual cursor preview</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10141b;
      color: #eef3fa;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #27364a 0, transparent 34%), #10141b;
    }
    main {
      width: min(760px, calc(100vw - 36px));
      padding: 28px;
      border: 1px solid #354256;
      border-radius: 18px;
      background: rgba(22, 28, 38, .92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .34);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { color: #aebbd0; margin: 0 0 22px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    button, input {
      border: 1px solid #53647d;
      border-radius: 10px;
      background: #202c3e;
      color: #f6f8fb;
      padding: 10px 13px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { background: #2d3d56; }
    input { min-width: 240px; background: #0f1621; }
    #status {
      min-height: 4em;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #0c1119;
      color: #b9c9dd;
      white-space: pre-wrap;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #occluder {
      display: none;
      position: absolute;
      z-index: 5;
      width: 170px;
      height: 52px;
      margin: 0;
      border-radius: 10px;
      background: rgba(226, 88, 92, .72);
      pointer-events: auto;
    }
    #occluder.visible { display: block; }

    /* Deliberately hostile page-level rules: the pointer must stay isolated. */
    #vcu-virtual-cursor {
      pointer-events: auto !important;
      width: 180px !important;
      height: 180px !important;
      background: #f04444 !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>VCU virtual cursor preview</h1>
    <p>Dark arrow, light outline, soft halo. Actions are synthetic DOM events and never move the OS cursor.</p>
    <div class="row">
      <button id="demo-hover" type="button">Hover target</button>
      <button id="demo-click" type="button">Click target</button>
      <span id="occluder" aria-hidden="true"></span>
      <button id="toggle-occluder" type="button">Toggle occluder</button>
    </div>
    <div class="row">
      <input id="demo-input" value="Ready for VCU type" aria-label="Type target">
      <button id="demo-type" type="button">Type target</button>
      <button id="demo-dry-run" type="button">Dry-run click</button>
    </div>
    <div id="status">Loading content.js…</div>
  </main>
  <script>
    (async () => {
      const status = document.querySelector("#status");
      const listeners = [];
      // The fixture supplies the smallest runtime surface needed by the
      // content script, without exposing production extension globals.
      window.chrome = { runtime: { onMessage: { addListener: (fn) => listeners.push(fn) } } };
      const source = await (await fetch("../../content.js", { cache: "no-store" })).text();
      (0, eval)(source);
      const bridge = listeners[0];
      const demoInput = document.querySelector("#demo-input");
      const nativeValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
      let ownValueSetterCalls = 0;
      // Exercise the React-style own value tracker: the production setter
      // path must call HTMLInputElement.prototype.value, bypassing this own
      // descriptor while still updating the native control.
      if (nativeValue && nativeValue.get && nativeValue.set) {
        Object.defineProperty(demoInput, "value", {
          configurable: true,
          get: () => nativeValue.get.call(demoInput),
          set: (value) => {
            ownValueSetterCalls += 1;
            nativeValue.set.call(demoInput, value);
          },
        });
      }

      function send(type, selector, params = {}) {
        return new Promise((resolve) => {
          bridge({ type, selector, ...params }, null, resolve);
        });
      }

      function show(label, result) {
        status.textContent = label + "\n" + JSON.stringify(result, null, 2);
      }

      const ping = await send("vcu_ping_page");
      show("Ready (content version " + ping.version + ")", ping);

      document.querySelector("#demo-hover").addEventListener("click", async () => {
        show("hover", await send("vcu_hover", "#demo-hover"));
        // Keep the real renderer visible long enough for a window screenshot.
        const preview = setInterval(() => void send("vcu_hover", "#demo-hover"), 250);
        setTimeout(() => clearInterval(preview), 4000);
      });
      document.querySelector("#demo-click").addEventListener("click", () => {
        status.textContent = "Target received the synthetic click (isTrusted=false).";
      });
      document.querySelector("#demo-type").addEventListener("click", async () => {
        const result = await send("vcu_type", "#demo-input", { text: "Typed by VCU" });
        result.fixture_own_value_setter_calls = ownValueSetterCalls;
        show("type", result);
      });
      document.querySelector("#demo-dry-run").addEventListener("click", async () => {
        show("dry-run", await send("vcu_click", "#demo-click", { dry_run: true }));
      });
      document.querySelector("#toggle-occluder").addEventListener("click", () => {
        const target = document.querySelector("#demo-click");
        const occluder = document.querySelector("#occluder");
        occluder.classList.toggle("visible");
        if (occluder.classList.contains("visible")) {
          const rect = target.getBoundingClientRect();
          occluder.style.left = rect.left + "px";
          occluder.style.top = rect.top + "px";
          show("occluder enabled", { ok: true, hint: "Click target now rejects an occluded hit." });
        } else {
          show("occluder disabled", { ok: true });
        }
      });
    })().catch((error) => {
      document.querySelector("#status").textContent = "Fixture failed: " + error;
    });
  </script>
</body>
</html>
