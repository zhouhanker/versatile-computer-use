<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>VCU · 网页选择面板预览</title><style>body{margin:40px;background:#f3f0f6;color:#25222b;font:16px system-ui}h1{font-size:24px}iframe{width:370px;height:740px;background:white;border:1px solid #dcd4e3;border-radius:16px;box-shadow:0 12px 50px #30203b18}</style><h1>网页选择与任务分组</h1><p>使用生产 popup.html / popup.js；仅浏览器列表为固定预览数据。</p><iframe title="VCU 网页选择面板"></iframe><script>
const bootstrap = `window.chrome={runtime:{getManifest:()=>({version:'0.2.3'}),sendMessage:async(msg)=>{if(msg.type==='status')return {ok:true,connected:true};if(msg.type==='browser_command')return {ok:true,tabs:[{tab_id:'1',window_id:'w1',title:'设计分享 · 交互说明',url:'https://design.example.com/notes',focused:true,group_id:'10'},{tab_id:'2',window_id:'w1',title:'参考与灵感',url:'https://design.example.com/references',group_id:'10'},{tab_id:'3',window_id:'w2',active:true,title:'组件文档',url:'https://docs.example.com',group_id:null}],groups:[{group_id:'10',title:'🎨 分享设计',color:'purple',collapsed:false}]};return {ok:true}},reload:()=>{}}};`;
fetch('/popup.html').then(r=>r.text()).then(html=>{document.querySelector('iframe').srcdoc=html.replace('<script src="popup.js"><'+'/script>','<script>'+bootstrap+'<'+'/script><script src="/popup.js"><'+'/script>')});
</script></html>
