<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>VCU · 浏览器交互验收</title>
<style>:root{font:16px/1.6 system-ui;color:#28252e;background:#f7f5fa}body{max-width:860px;margin:60px auto;padding:32px;background:white;border-radius:20px}h1{font-size:32px;margin:0 0 12px}small{color:#746e7d}button,input{font:inherit;padding:12px 20px;margin:12px 8px 12px 0;border-radius:10px;border:1px solid #c4b7d1}button{background:#a83db3;color:white;cursor:pointer}input{background:#faf9fc}#result{display:block;padding:20px;background:#f2ecf6;border-radius:12px}#covered-wrap{position:relative;width:240px}#cover{position:absolute;inset:0;background:#eee9f2bb;z-index:1;display:grid;place-items:center;border-radius:10px}iframe{width:390px;height:680px;border:1px solid #ddd;border-radius:16px;margin-top:20px}#spacer{height:600px}</style>
<small>VCU / CONTROLLED BROWSER CHECK</small><h1>每次操作，都有可核验的结果</h1><p>本地受控页面 · 不提交数据 · 不发送消息</p>
<button id="counter">点击计数 +1</button><input id="entry" aria-label="测试输入" placeholder="输入测试文字"><output id="result">clicks=0; input=</output>
<p><button disabled id="disabled">禁用按钮</button><input id="readonly" readonly value="不可改写"></p>
<div id="covered-wrap"><button id="covered">被遮挡按钮</button><div id="cover">遮挡层</div></div>
<div id="popup-preview"></div><div id="spacer"></div><button id="bottom">页底按钮</button>
<script>let count=0;const result=document.querySelector('#result');function render(){result.textContent='clicks='+count+'; input='+document.querySelector('#entry').value}document.querySelector('#counter').onclick=()=>{count++;render()};document.querySelector('#entry').oninput=render;document.querySelector('#covered').onclick=()=>{result.textContent='ERROR: covered was clicked'};document.querySelector('#bottom').onclick=()=>{result.textContent+='; bottom=clicked'};</script></html>
