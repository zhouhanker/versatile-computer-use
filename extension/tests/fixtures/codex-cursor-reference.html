<!doctype html><html><meta charset="utf-8"><title>Codex cursor rendering reference</title><style>body{font:18px system-ui;background:#f7f7f9;color:#222;padding:60px}button,input{font:inherit;margin:12px;padding:18px;border:1px solid #aaa;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;background:white;border:1px solid #ddd;padding:16px}</style><h1>Codex cursor rendering reference</h1><p>Local test page; record only the visible Codex cursor overlay during an action.</p><button id="target">Click reference target</button><input placeholder="Type reference text"><p id="count">clicks=0</p><pre id="cursor-reference">No cursor overlay observed yet.</pre><script>
let count=0;document.querySelector('#target').onclick=()=>document.querySelector('#count').textContent='clicks='+ ++count;
const observed=[];const output=document.querySelector('#cursor-reference');
function inOverlay(node){if(node?.nodeType!==1)return false;return node.id==='codex-agent-overlay-root'||!!node.closest?.('#codex-agent-overlay-root')}
function snapshot(node){if(node.nodeType!==1)return null;const style=getComputedStyle(node);return {html:node.outerHTML,computed:{position:style.position,transform:style.transform,width:style.width,height:style.height,background:style.background,boxShadow:style.boxShadow,opacity:style.opacity}}}
new MutationObserver(records=>{let changed=false;for(const record of records){if(inOverlay(record.target)){for(const n of [...record.addedNodes,...record.removedNodes]){const s=snapshot(n);if(s){observed.push(s);changed=true}}if(record.type==='attributes'){observed.push(snapshot(record.target));changed=true}}}if(changed){output.textContent=JSON.stringify(observed.slice(-30),null,2)}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true});
</script></html>
