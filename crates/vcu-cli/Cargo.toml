[package]
name = "vcu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vcu"
path = "src/main.rs"

[dependencies]
vcu-core = { workspace = true }
vcu-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "blocking"] }  # blocking via workspace
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
