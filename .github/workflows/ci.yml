name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace
      - name: mock poc (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build -p vcu-cli -p vcu-daemon -p vcu-mcp
          bash scripts/poc_mock_flow.sh
          bash scripts/poc_actions_extra.sh
      - name: mock smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p vcu-cli -p vcu-daemon -p vcu-mcp
          $bin = "target/debug"
          $env:Path = "$pwd\$bin;$env:Path"
          $ud = Join-Path $env:TEMP ("vcu-ci-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $ud | Out-Null
          & "$bin/vcu.exe" --user-dir $ud init --json
          $cfgPath = Join-Path $ud "config.json"
          $cfg = Get-Content $cfgPath | ConvertFrom-Json
          $cfg.daemon_port = 19000 + (Get-Random -Maximum 1000)
          $cfg | ConvertTo-Json | Set-Content $cfgPath
          $d = Start-Process -FilePath "$bin/vcu-daemon.exe" -ArgumentList @("--user-dir", $ud) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $s = & "$bin/vcu.exe" --user-dir $ud session start --backend mock --json | ConvertFrom-Json
          if (-not $s.ok) { throw "session start failed: $($s | ConvertTo-Json -Depth 5)" }
          $sid = $s.data.session_id
          $n = & "$bin/vcu.exe" --user-dir $ud navigate --session $sid --url "https://example.com" --json | ConvertFrom-Json
          if (-not $n.ok) { throw "navigate failed" }
          $snap = & "$bin/vcu.exe" --user-dir $ud snapshot --session $sid --mode a11y --json | ConvertFrom-Json
          if (-not $snap.ok) { throw "snapshot failed" }
          Stop-Process -Id $d.Id -Force -ErrorAction SilentlyContinue
          Write-Host "WINDOWS MOCK SMOKE PASSED"

  package-macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: build arm64 + x64 packages
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          mkdir -p dist

          pack_one() {
            local triple="$1" plat="$2"
            echo "=== building $plat ($triple) ==="
            cargo build --release -p vcu-cli -p vcu-daemon -p vcu-mcp --target "$triple"
            STAGE="dist/stage/vcu-${VER}-${plat}"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/bin" "$STAGE/extension" "$STAGE/skills" "$STAGE/docs" "$STAGE/scripts/macos" "$STAGE/scripts/install"
            cp "target/${triple}/release/vcu" "$STAGE/bin/"
            cp "target/${triple}/release/vcu-daemon" "$STAGE/bin/"
            cp "target/${triple}/release/vcu-mcp" "$STAGE/bin/"
            chmod +x "$STAGE/bin/"*
            cp -R extension/* "$STAGE/extension/" 2>/dev/null || true
            cp -R skills/* "$STAGE/skills/" 2>/dev/null || true
            cp docs/INSTALL.md "$STAGE/docs/" 2>/dev/null || true
            cp -R scripts/macos/* "$STAGE/scripts/macos/" 2>/dev/null || true
            cp scripts/install/install.sh scripts/install/install.ps1 "$STAGE/scripts/install/" 2>/dev/null || true
            cp README.md LICENSE "$STAGE/" 2>/dev/null || true
            tar -C dist/stage -czf "dist/vcu-${VER}-${plat}.tar.gz" "vcu-${VER}-${plat}"
            cp "dist/vcu-${VER}-${plat}.tar.gz" "dist/vcu-latest-${plat}.tar.gz"
            (cd dist && shasum -a 256 "vcu-${VER}-${plat}.tar.gz" | tee "vcu-${VER}-${plat}.tar.gz.sha256")
            cp "dist/vcu-${VER}-${plat}.tar.gz.sha256" "dist/vcu-latest-${plat}.tar.gz.sha256"
          }

          pack_one aarch64-apple-darwin macos-arm64
          pack_one x86_64-apple-darwin macos-x64
          cp scripts/install/install.sh scripts/install/install.ps1 dist/
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: vcu-macos-packages
          path: |
            dist/vcu-*.tar.gz
            dist/vcu-*.sha256
            dist/install.sh
            dist/install.ps1

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pack windows-x64
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          cargo build --release -p vcu-cli -p vcu-daemon -p vcu-mcp
          $plat = "windows-x64"
          $stage = "dist/stage/vcu-$ver-$plat"
          New-Item -ItemType Directory -Force -Path "$stage/bin","$stage/extension","$stage/skills","$stage/docs","$stage/scripts/install" | Out-Null
          Copy-Item target/release/vcu.exe,target/release/vcu-daemon.exe,target/release/vcu-mcp.exe "$stage/bin/"
          if (Test-Path extension) { Copy-Item extension/* "$stage/extension/" -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* "$stage/skills/" -Recurse -Force }
          Copy-Item docs/INSTALL.md "$stage/docs/" -ErrorAction SilentlyContinue
          Copy-Item scripts/install/install.sh,scripts/install/install.ps1 "$stage/scripts/install/" -ErrorAction SilentlyContinue
          Copy-Item README.md,LICENSE "$stage/" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar -C dist/stage -czf "dist/vcu-$ver-$plat.tar.gz" "vcu-$ver-$plat"
          Copy-Item "dist/vcu-$ver-$plat.tar.gz" "dist/vcu-latest-$plat.tar.gz"
          Get-FileHash "dist/vcu-$ver-$plat.tar.gz" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  vcu-$ver-$plat.tar.gz" } |
            Set-Content "dist/vcu-$ver-$plat.tar.gz.sha256"
          Copy-Item "dist/vcu-$ver-$plat.tar.gz.sha256" "dist/vcu-latest-$plat.tar.gz.sha256"
          Copy-Item scripts/install/install.sh,scripts/install/install.ps1 dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: vcu-windows-x64
          path: |
            dist/vcu-*.tar.gz
            dist/vcu-*.sha256
            dist/install.sh
            dist/install.ps1
