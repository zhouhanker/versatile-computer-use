name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          fi
      - name: pack both mac arches
        env:
          VCU_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          VER="$VCU_VERSION"
          mkdir -p dist
          pack_one() {
            local triple="$1" plat="$2"
            cargo build --release -p vcu-cli -p vcu-daemon -p vcu-mcp --target "$triple"
            STAGE="dist/stage/vcu-${VER}-${plat}"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/bin" "$STAGE/extension" "$STAGE/skills" "$STAGE/docs" "$STAGE/scripts/macos" "$STAGE/scripts/install"
            cp "target/${triple}/release/vcu" "target/${triple}/release/vcu-daemon" "target/${triple}/release/vcu-mcp" "$STAGE/bin/"
            case "$triple" in
              aarch64-apple-darwin) bash scripts/build-stage.sh "$STAGE/bin/vcu-stage" arm64-apple-macosx13.0 ;;
              x86_64-apple-darwin) bash scripts/build-stage.sh "$STAGE/bin/vcu-stage" x86_64-apple-macosx13.0 ;;
            esac
            chmod +x "$STAGE/bin/"*
            cp -R extension/* "$STAGE/extension/" 2>/dev/null || true
            cp -R skills/* "$STAGE/skills/" 2>/dev/null || true
            cp docs/INSTALL.md "$STAGE/docs/" 2>/dev/null || true
            cp -R scripts/macos/* "$STAGE/scripts/macos/" 2>/dev/null || true
            cp scripts/install/* "$STAGE/scripts/install/" 2>/dev/null || true
            cp README.md LICENSE "$STAGE/" 2>/dev/null || true
            tar -C dist/stage -czf "dist/vcu-${VER}-${plat}.tar.gz" "vcu-${VER}-${plat}"
            cp "dist/vcu-${VER}-${plat}.tar.gz" "dist/vcu-latest-${plat}.tar.gz"
            (cd dist && shasum -a 256 "vcu-${VER}-${plat}.tar.gz" | tee "vcu-${VER}-${plat}.tar.gz.sha256")
            cp "dist/vcu-${VER}-${plat}.tar.gz.sha256" "dist/vcu-latest-${plat}.tar.gz.sha256"
          }
          pack_one aarch64-apple-darwin macos-arm64
          pack_one x86_64-apple-darwin macos-x64
          cp scripts/install/install.sh scripts/install/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          fi
      - name: pack windows
        shell: pwsh
        env:
          VCU_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ver = $env:VCU_VERSION
          cargo build --release -p vcu-cli -p vcu-daemon -p vcu-mcp
          $plat = "windows-x64"
          $stage = "dist/stage/vcu-$ver-$plat"
          New-Item -ItemType Directory -Force -Path "$stage/bin","$stage/extension","$stage/skills","$stage/docs","$stage/scripts/install" | Out-Null
          Copy-Item target/release/vcu.exe,target/release/vcu-daemon.exe,target/release/vcu-mcp.exe "$stage/bin/"
          if (Test-Path extension) { Copy-Item extension/* "$stage/extension/" -Recurse -Force }
          if (Test-Path skills) { Copy-Item skills/* "$stage/skills/" -Recurse -Force }
          Copy-Item docs/INSTALL.md "$stage/docs/" -ErrorAction SilentlyContinue
          Copy-Item scripts/install/* "$stage/scripts/install/" -ErrorAction SilentlyContinue
          Copy-Item README.md,LICENSE "$stage/" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar -C dist/stage -czf "dist/vcu-$ver-$plat.tar.gz" "vcu-$ver-$plat"
          Copy-Item "dist/vcu-$ver-$plat.tar.gz" "dist/vcu-latest-$plat.tar.gz"
          Get-FileHash "dist/vcu-$ver-$plat.tar.gz" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  vcu-$ver-$plat.tar.gz" } |
            Set-Content "dist/vcu-$ver-$plat.tar.gz.sha256"
          Copy-Item "dist/vcu-$ver-$plat.tar.gz.sha256" "dist/vcu-latest-$plat.tar.gz.sha256"
          Copy-Item scripts/install/install.sh,scripts/install/install.ps1 dist/
          if (Test-Path "$stage/extension/manifest.json") {
            python scripts/install/package_lens.py --source "$stage/extension" --dest "dist/vcu-lens-extension.zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'vcu-*.tar.gz' -o -name 'vcu-*.sha256' -o -name 'install.sh' -o -name 'install.ps1' -o -name 'vcu-lens-extension.zip' \) -exec cp -n {} dist/ \; || true
          find artifacts -type f \( -name 'vcu-*.tar.gz' -o -name 'vcu-*.sha256' -o -name 'install.sh' -o -name 'install.ps1' -o -name 'vcu-lens-extension.zip' \) -exec cp {} dist/ \;
          # The windows artifact carries a CRLF install.sh (checkout autocrlf);
          # normalize with tr (portable) so `curl | sh` works on macOS/Linux.
          if [ -f dist/install.sh ]; then
            tr -d '\r' < dist/install.sh > dist/install.sh.lf && mv dist/install.sh.lf dist/install.sh
          fi
          ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          # Explicit list: a bare dist/* glob also matches dist/.gitkeep and
          # GitHub rejects zero-byte release assets, which fails the job after
          # every real asset has already been uploaded.
          files: |
            dist/vcu-*.tar.gz
            dist/vcu-*.sha256
            dist/install.sh
            dist/install.ps1
            dist/vcu-lens-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
